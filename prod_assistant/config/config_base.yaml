# Overview
# --------
# This file defines the **base configuration schema** for the PulseFlow system.
# It serves as the environment-agnostic foundation from which all environment-
# specific configuration files (e.g., `config_dev.yaml`, `config_prod.yaml`)
# inherit. Only environment-sensitive values such as API keys, secrets, or
# endpoints should be overridden in those respective YAMLs.
#
# Core Responsibilities
# ---------------------
# - Define application-level defaults (app name, port, environment).
# - Specify model configuration for embeddings and LLMs.
# - Provide a unified provider registry for OpenAI, Groq, and Google models.
# - Enable the `ModelLoader` utility to dynamically load the correct provider
#   configuration based on environment and registry lookup.
#
# Workflow Topology
# -----------------
# Config Loader → ModelLoader → Retriever / LLM Agents
#
# External Integrations
# ---------------------
# - **LangChain** — For model class definitions and API usage.
# - **OpenAI / Groq / Google Generative AI** — For embedding and LLM models.
# - **Environment Variables (.env / AWS Secrets Manager)** — For API keys.
#
# Changelog
# ----------
# v1.0.0 (2025-10-10)
