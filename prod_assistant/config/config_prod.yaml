# -----------------------------------------------------------------
# Application Metadata
# -----------------------------------------------------------------
app:
  name: pulseflow
  env: prod
  port: 8080


# -----------------------------------------------------------------
# Model Secrets Override
# -----------------------------------------------------------------
llm:
  provider: openai
  model: ${OPENAI_API_KEY}        # read from AWS Secrets Manager
  embedding_model: ${EMBED_MODEL}


# -----------------------------------------------------------------
# AstraDB Configuration (Vector Store)
# -----------------------------------------------------------------
astra:
  db_id: ${ASTRA_DB_ID}
  keyspace: ${ASTRA_DB_KEYSPACE}
  token: ${ASTRA_DB_APPLICATION_TOKEN}
