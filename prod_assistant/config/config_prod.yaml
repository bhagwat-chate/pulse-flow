# Overview
# --------
# This file defines the **production-specific configuration overrides** for the
# PulseFlow system. It extends the `config_base.yaml` baseline with secure,
# runtime-injected secrets and database credentials intended for AWS ECS/Fargate
# or EKS deployments. All secret values are fetched from AWS Secrets Manager or
# environment variables provided at container runtime.
#
# Core Responsibilities
# ---------------------
# - Define the active runtime environment as `prod`.
# - Bind secure API keys for LLMs and embedding models from Secrets Manager.
# - Configure AstraDB connection parameters for persistent vector storage.
# - Serve as the configuration entrypoint for ECS tasks and CI/CD pipelines.
#
# Workflow Topology
# -----------------
# ECS Task → Config Loader → ModelLoader → AgenticRAG → CloudWatch / LangSmith
#
# External Integrations
# ---------------------
# - **OpenAI** — Production-grade LLM and embeddings provider.
# - **AstraDB (DataStax)** — Persistent vector store for retrieval contexts.
# - **AWS Secrets Manager** — Injects credentials securely at runtime.
# - **CloudWatch** — Monitors logs and system health.
#
# Changelog
# ----------
# v1.0.0 (2025-10-10)
#     • Established production configuration schema for ECS/Fargate deployments.
#     • Added secret substitution placeholders for OpenAI and AstraDB.
#     • Integrated environment-agnostic compatibility with config_base.yaml.
